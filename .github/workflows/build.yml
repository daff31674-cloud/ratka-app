name: Build Apps

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller pillow
      - run: pyinstaller --onefile --add-data "config.json;." pc_client.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: dist/pc_client.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - run: pip install --upgrade pip cython==0.29.36 buildozer
      - run: cp android_controller.py main.py
      - run: buildozer init
      - run: |
          sed -i 's/title = My Application/title = RatkaController/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = ratkacontroller/' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = org.ratka/' buildozer.spec
          sed -i 's/source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas,json/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,urllib3,certifi,idna,charset-normalizer/' buildozer.spec
          sed -i 's/#android.permissions = INTERNET/android.permissions = INTERNET/' buildozer.spec
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
      - run: buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-controller-apk
          path: bin/*.apk
