- run: |
          sed -i 's/title = My Application/title = RatkaController/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = ratkacontroller/' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = org.ratka/' buildozer.spec
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,requests,urllib3,certifi,charset-normalizer,idna/' buildozer.spec
          sed -i 's/#android.api =/android.api = 33/' buildozer.spec
          sed -i 's/#android.minapi =/android.minapi = 21/' buildozer.spec
          sed -i 's/#android.ndk =/android.ndk = 25b/' buildozer.spec
          echo "android.build_tools_version = 33.0.2" >> buildozer.spec
      - run: yes | buildozer android debug
